name: Daily Newsletter Summary

on:
  # Two editions per day (IST). 08:00 IST = 02:30 UTC, 20:00 IST = 14:30 UTC.
  schedule:
    - cron: '30 2 * * *'    # Morning edition — 08:00 IST
    - cron: '30 14 * * *'   # Evening edition — 20:00 IST

  # Allow manual trigger; edition auto-derived from IST hour unless overridden.
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to run (leave blank to auto-derive from IST hour)'
        required: false
        type: choice
        options:
          - ''
          - morning
          - evening
        default: ''

permissions:
  contents: write
  id-token: write  # Required by anthropics/claude-code-action for OIDC auth
  issues: write    # Required for QA agent to file issues on findings

# Serialize all wiki-writing workflows to avoid merge conflicts
concurrency:
  group: wiki-write
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve edition
        id: edition
        run: |
          ED="${{ github.event.inputs.edition }}"
          if [ -z "$ED" ]; then
            H=$(TZ=Asia/Kolkata date +%H)
            if [ "$H" -lt 14 ]; then ED=morning; else ED=evening; fi
          fi
          IST_DATE=$(TZ=Asia/Kolkata date +%F)
          echo "edition=$ED" >> "$GITHUB_OUTPUT"
          echo "ist_date=$IST_DATE" >> "$GITHUB_OUTPUT"
          echo "summary_file=data/summaries/${IST_DATE}-${ED}.json" >> "$GITHUB_OUTPUT"
          echo "Resolved edition: $ED  (IST date $IST_DATE)"

      - name: Run newsletter summarization
        env:
          EDITION: ${{ steps.edition.outputs.edition }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          NEWSLETTER_SENDERS: ${{ secrets.NEWSLETTER_SENDERS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          RESEARCH_AGENT_ENABLED: ${{ secrets.RESEARCH_AGENT_ENABLED }}
          RESEARCH_MODEL: ${{ secrets.RESEARCH_MODEL }}
          RESEARCH_SEARCH_MODEL: ${{ secrets.RESEARCH_SEARCH_MODEL }}
          RESEARCH_MAX_SEARCHES: ${{ secrets.RESEARCH_MAX_SEARCHES }}
          TZ: Asia/Kolkata
        run: npm start

      - name: Commit summary data (pre-wiki)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/summaries/
          if git diff --staged --quiet; then
            echo "No new summary to commit"
          else
            git commit -m "Add ${{ steps.edition.outputs.edition }} summary for ${{ steps.edition.outputs.ist_date }}"
            git push
          fi

      - name: Wiki ingestion via Claude Code
        if: success()
        # Wiki ingestion is a secondary, best-effort step. The email and summary
        # JSON have already shipped by this point, so a wiki hiccup (e.g. the
        # agent running long on a heavy day) must NOT mark the whole run red.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are performing the INGEST operation for the LLM Wiki.

            Step 1: Read `wiki/WIKI.md` completely. This is the schema — follow it exactly.

            Step 2: This run produced exactly one summary file: `${{ steps.edition.outputs.summary_file }}` (the ${{ steps.edition.outputs.edition }} edition). Process ONLY that file. If it does not exist (no newsletters arrived this window), make NO changes and stop.

            Step 3: Read `wiki/log.md`. If it already contains an entry for this exact file, it's already ingested — make NO changes and stop. Otherwise proceed. IMPORTANT: do NOT attempt to back-fill older un-ingested dates. A large historical gap in log.md is expected and is cleared separately by the manually-dispatched "Backfill Wiki" workflow. Ingesting more than this one file will overrun the turn budget and is forbidden.

            Step 4: For this edition's summary file, perform the INGEST operation as defined in WIKI.md:
            - Identify entities mentioned: companies, products, topics, trends
            - For each entity: update the relevant page in wiki/companies/, wiki/products/, wiki/topics/, or wiki/trends/ (create new pages if needed, using kebab-case filenames)
            - Follow the exact page template in WIKI.md (Summary, Timeline, Key Facts, Open Questions, Sources)
            - Add cross-references between related pages using [[page-name]] syntax
            - Aim for 3-8 page updates per newsletter; 10-15 total per daily ingest

            Step 5: Update `wiki/index.md` — add any new pages you created to the appropriate section (Companies/Products/Topics/Trends). Sort alphabetically.

            Step 6: Append an entry to `wiki/log.md` using the exact format in WIKI.md (list which pages were updated, which were created, any notable patterns observed).

            Step 7: Do NOT commit — a subsequent step will handle committing the wiki changes.

            Rules:
            - Only touch files under `wiki/`. Never edit `data/summaries/` (immutable raw sources).
            - Scope: AI/ML/developer tools only. Skip non-AI content (skincare, travel, generic business news, webinar spam).
            - Don't page-ify ephemeral content (webinar invitations, course promos, price-change notifications).
            - Be concise. Timeline entries are one line each. Summary sections are 1-2 paragraphs.
            - If you encounter a contradiction between new info and existing page content, resolve it by checking the source JSON — the newer source wins unless clearly wrong.
          claude_args: |
            --max-turns 50
            --model claude-opus-4-7
            --allowedTools Read,Write,Edit,Glob,Grep

      - name: Commit wiki changes
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Re-embed auth token (Claude Code Action detaches default credential)
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add wiki/
          if git diff --staged --quiet; then
            echo "No wiki changes to commit"
          else
            git commit -m "wiki: ingest $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push
          fi

      # ======================================================================
      # Post-send audit QA — reads the latest summary JSON, re-renders the
      # email HTML locally, and asks Claude Code to spot issues. Audit-mode
      # only: doesn't block anything (email already sent), but opens a
      # GitHub issue if problems are found so they can be fixed for the
      # next day. This closes the feedback loop on daily email quality.
      # ======================================================================

      - name: Re-render today's email HTML for QA
        id: qa_prep
        if: always()
        run: |
          mkdir -p /tmp/qa
          LATEST=$(ls -1t data/summaries/*.json 2>/dev/null | grep -v index.json | head -1)
          if [ -z "$LATEST" ]; then
            echo "No summary JSON to QA"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          node --experimental-vm-modules -e "
          import('./src/notifier/email.js').then(async mod => {
            const fs = await import('fs/promises');
            const data = JSON.parse(await fs.readFile('$LATEST', 'utf-8'));
            const { EmailNotifier } = mod;
            const n = Object.create(EmailNotifier.prototype);
            const ds = new Date(data.date).toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const dp = new Date(data.date).toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
            const html = n.generateHtmlEmail(data.summary, data.newsletters, data.totalNewsletters, ds, dp, data.tldr, data.researchFindings);
            await fs.writeFile('/tmp/qa/email.html', html, 'utf-8');
            await fs.writeFile('/tmp/qa/summary.json', JSON.stringify(data, null, 2), 'utf-8');
            console.log('HTML size:', html.length, 'bytes');
          });
          "
          echo "json_path=$LATEST" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Post-send QA via Claude Code
        if: always() && steps.qa_prep.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are performing POST-SEND AUDIT QA on today's daily newsletter email.
            The email has ALREADY been sent — this is audit mode. You cannot block it.
            Your job: identify issues so they can be fixed for future runs.

            Artifacts to inspect:
            - Rendered HTML email: /tmp/qa/email.html
            - Source summary JSON: /tmp/qa/summary.json

            Checks to perform:

            **Critical** (log as critical severity)
            1. Wrong date — the subject/body date should match today's IST calendar day
            2. HTML > 102 KB (Gmail clipping threshold)
            3. Known spam senders present in newsletters array (look for: thetechbuzz, Real Intent, michaeljburry, realintent.com)
            4. Literal `[[wiki-link]]` text visible in rendered body (should be rare/none for daily)

            **Warning** (log as warning severity)
            5. Priority distribution skewed — if 0 LOW or >70% HIGH, the priority filter isn't working
            6. Tracking URLs still in summary bodies (beehiiv/tldrnewsletter/skool/alphasignal tracking domains)
            7. A single story (like "Claude Opus X.Y") mentioned >5 times across summaries — dedup isn't working
            8. TLDR missing or has < 3 bullets
            9. totalNewsletters > 30 — suggests pipeline fetched multiple days in one run

            **Info** (log as info severity)
            10. Research findings section empty when RESEARCH_AGENT_ENABLED is true
            11. Any newsletter summary under 50 words (likely an error or empty newsletter)

            Write your report to `/tmp/qa/qa-report.json`:
            ```json
            {
              "overall": "PASS" | "PASS_WITH_WARNINGS" | "FAIL",
              "issues": [
                {"severity":"critical|warning|info","category":"content|formatting","description":"...","recommendation":"..."}
              ],
              "summary": "one sentence",
              "metrics": {
                "html_size_kb": <number>,
                "total_newsletters": <number>,
                "priority_distribution": {"HIGH":N,"MEDIUM":N,"LOW":N},
                "subject_date": "..."
              }
            }
            ```

            Rules:
            - Do NOT edit source files. Only write /tmp/qa/qa-report.json.
            - Be specific: cite newsletter subjects, byte counts, etc.
            - If all checks pass, report PASS with empty issues array.
          claude_args: |
            --max-turns 25
            --model claude-opus-4-7
            --allowedTools Read,Write,Glob,Grep

      - name: File issue on QA findings
        if: always() && steps.qa_prep.outputs.skip != 'true'
        continue-on-error: true   # Don't let issue-filing failure cascade
        run: |
          if [ ! -f /tmp/qa/qa-report.json ]; then
            echo "No QA report written — skipping issue filing"
            exit 0
          fi
          echo "--- Daily QA Report ---"
          cat /tmp/qa/qa-report.json
          echo "-----------------------"
          OVERALL=$(jq -r '.overall' /tmp/qa/qa-report.json 2>/dev/null || echo "UNKNOWN")
          ISSUE_COUNT=$(jq -r '.issues | length' /tmp/qa/qa-report.json 2>/dev/null || echo "0")
          if [ "$OVERALL" = "PASS" ] || [ "$ISSUE_COUNT" = "0" ]; then
            echo "✅ QA passed — no issue to file"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          SUMMARY=$(jq -r '.summary // "Daily digest QA found issues"' /tmp/qa/qa-report.json)
          BODY=$(jq -r '.issues[] | "**[" + .severity + "][" + .category + "]** " + .description + "\n_Recommendation:_ " + .recommendation + "\n"' /tmp/qa/qa-report.json)
          METRICS=$(jq -r '.metrics | to_entries | map("- **\(.key)**: \(.value | tostring)") | .[]' /tmp/qa/qa-report.json)
          gh issue create \
            --title "Daily QA ($DATE): $OVERALL" \
            --body "$(cat <<EOF
          $SUMMARY

          ## Metrics
          $METRICS

          ## Issues found
          $BODY

          ---
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # End of post-send audit QA

      - name: Upload summary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-summary-${{ github.run_number }}
          path: data/summaries/
          retention-days: 90
