name: Weekly Wiki Digest

on:
  # Run every Sunday at 9:00 AM IST (3:30 AM UTC)
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # Required by anthropics/claude-code-action for OIDC auth

# Serialize all wiki-writing workflows to avoid merge conflicts
concurrency:
  group: wiki-write
  cancel-in-progress: false

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Claude Code — LINT + generate weekly digest
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are performing the weekly LINT + DIGEST operation for the LLM Wiki.

            Step 1: Read `wiki/WIKI.md` completely. Follow its conventions.

            Step 2: Determine the week to digest. Read `wiki/log.md` and find the most recent dated ingests. Use the most recent 7 ingest dates. Compute ISO week (YYYY-WW) for the latest of those dates.

            Step 3: LINT the wiki:
            - Scan all wiki pages for obvious contradictions (same event dated differently). Resolve by preferring the more detailed entry.
            - Detect orphan pages (no `[[cross-refs]]` from any other page) — add at least one cross-reference.
            - Detect near-duplicate pages — merge and leave a redirect note on the loser.
            - For pages untouched in 60+ days based on "Last updated" frontmatter, mark `> **Status**: stale`.
            - Regenerate `wiki/index.md` from the actual directory listing.

            Step 4: Generate the weekly digest at `wiki/digests/YYYY-WW.md`. **THIS DIGEST MUST BE SUBSTANTIAL — aim for 3000-5000 words of real synthesis. Be detailed and prose-heavy, not bullet-only.** Use this template:

            ```
            # Weekly Digest — YYYY-WW (Week of YYYY-MM-DD)

            > **Ingest range**: YYYY-MM-DD → YYYY-MM-DD
            > **Summaries covered**: N daily ingests
            > **Wiki pages touched**: M total (from log.md entries this week)
            > **New pages**: K
            > **Most active pages**: <top 3 with update counts>

            ## 📌 If You Only Read One Thing

            <Single most important story of the week — 2-3 paragraphs of prose, not bullets. Include WHAT happened, WHY it matters, WHO it affects, and WHAT to watch next. Reference the source pages with [[link]].>

            ## 🔥 Top 10 Stories This Week

            For EACH of the 10 stories, write a full paragraph (3-5 sentences) covering:
            - The headline event
            - Specific names, products, dollar amounts, dates
            - Why it matters strategically
            - Cross-references to wiki pages
            Number them 1-10. Order by impact (most impactful first).

            ## 📊 By the Numbers

            A bullet list of concrete numbers from the week — e.g.,
            - $X billion in AI funding announced (companies: A, B, C)
            - N new model releases (list them)
            - N% performance improvement claims
            - N regulatory actions
            (Pull real numbers from wiki pages — be specific.)

            ## 🆕 New Pages Created This Week

            Group under Companies / Products / Topics / Trends. For each, give a one-sentence description AND why it earned a page (what threshold of significance was crossed).

            ## 📈 Pages with Biggest Updates

            For each page that absorbed 3+ events this week, write a paragraph summarizing the week's activity on that page. Don't just count — describe the arc.

            ## 🔗 Cross-Cutting Patterns & Themes

            Identify 5-7 patterns where multiple stories share a theme. For each pattern, write 2-3 sentences describing the pattern and which pages embody it. These should be insights the daily ingests would miss in isolation.

            ## 💡 Featured Page Deep-Dive

            Pick the SINGLE most updated/interesting page from this week and reproduce its full Summary section verbatim, plus its 5 most recent Timeline entries. This gives the reader a deep read on one thing without leaving the digest.

            ## 📌 Stories Worth Watching Next Week

            5-7 forward-looking items: things that are nascent but could grow. For each, write 1-2 sentences on what to watch for and why it might matter.

            ## 🎤 Notable Quotes & Claims

            If any wiki page Timeline entry contains a direct quote or specific claim worth highlighting (executive statement, benchmark number, controversial assertion), pull 3-5 of these out with attribution. These are the "memorable lines" of the week.

            ---
            *Generated by weekly wiki lint. Built from N daily ingests covering Y wiki pages.*
            ```

            Step 5: Update `wiki/index.md` — add this week's digest under the "Digests" section.

            Step 6: Append a LINT entry to `wiki/log.md` at the top:

            ```
            ## LINT YYYY-MM-DD (week YYYY-WW)

            **Lint actions**:
            - Fixed contradictions: <list if any>
            - Resolved orphans: <count>
            - Merged duplicates: <list if any>
            - Stale pages marked: <count>

            **Digest generated**: wiki/digests/YYYY-WW.md (~N words)
            ```

            Rules:
            - Only touch files under `wiki/`. Never modify `data/summaries/`.
            - If the wiki has < 7 days of ingests, still generate a digest covering what exists, but note this in the header.
            - PROSE-HEAVY: every section except "By the Numbers" and "New Pages" should be paragraph-style, not bullet-only. The user complained the previous digest was too short — this must be a substantial read (3000+ words).
            - Be specific: names, dollar amounts, dates, version numbers. No vague summaries.
            - Do NOT commit — the next workflow step handles commits.
          claude_args: |
            --max-turns 80
            --model claude-opus-4-7
            --allowedTools Read,Write,Edit,Glob,Grep

      - name: Commit wiki changes
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add wiki/
          if git diff --staged --quiet; then
            echo "No wiki changes to commit"
          else
            git commit -m "wiki: weekly lint + digest $(date -u +%Y-%V)"
            git pull --rebase origin main || true
            git push
          fi

      - name: Find the latest digest file
        id: digest
        run: |
          LATEST=$(ls -1t wiki/digests/*.md 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then
            echo "No digest found — Claude Code did not generate one"
            exit 1
          fi
          echo "md_path=$LATEST" >> $GITHUB_OUTPUT
          BASENAME=$(basename "$LATEST" .md)
          DOCX_PATH="/tmp/weekly-digest-${BASENAME}.docx"
          echo "docx_path=$DOCX_PATH" >> $GITHUB_OUTPUT
          echo "basename=$BASENAME" >> $GITHUB_OUTPUT
          echo "Found digest: $LATEST → $DOCX_PATH"

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Preprocess markdown for DOCX (strip [[wiki-link]] syntax)
        id: preprocess
        run: |
          PROCESSED="/tmp/preprocessed-${{ steps.digest.outputs.basename }}.md"
          # Convert [[page-name]] → **Page Name** (title-cased, space-separated) so pandoc renders cleanly
          perl -pe 's/\[\[([^\]]+)\]\]/"**" . join(" ", map { ucfirst } split(\/-\/, $1)) . "**"/ge' \
            "${{ steps.digest.outputs.md_path }}" > "$PROCESSED"
          echo "path=$PROCESSED" >> $GITHUB_OUTPUT
          echo "Preprocessed digest written to $PROCESSED"

      - name: Convert digest markdown to DOCX (pandoc)
        run: |
          pandoc "${{ steps.preprocess.outputs.path }}" \
            -o "${{ steps.digest.outputs.docx_path }}" \
            --from gfm \
            --to docx \
            --metadata "title=Weekly AI Wiki Digest — ${{ steps.digest.outputs.basename }}"
          ls -la "${{ steps.digest.outputs.docx_path }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send weekly digest email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          DIGEST_PATH: ${{ steps.digest.outputs.md_path }}
          DIGEST_DOCX_PATH: ${{ steps.digest.outputs.docx_path }}
          TZ: Asia/Kolkata
        run: node src/weekly-digest-email.js
