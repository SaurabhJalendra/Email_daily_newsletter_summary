name: Weekly Wiki Digest

on:
  # Run every Sunday at 9:00 AM IST (3:30 AM UTC)
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # Required by anthropics/claude-code-action for OIDC auth

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Claude Code — LINT + generate weekly digest
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are performing the weekly LINT + DIGEST operation for the LLM Wiki.

            Step 1: Read `wiki/WIKI.md` completely. Follow its conventions.

            Step 2: Determine the current ISO week: find the most recent Monday (or the Monday of this week if today is Sunday) and compute YYYY-WW format. Use `date` command via Read on today's date — but since we can't run shell, use the most recent dated log entry in `wiki/log.md` and compute the week that contains that date. Default to the most recent 7 dates in log.md if week math is hard.

            Step 3: LINT the wiki:
            - Scan all wiki pages for obvious contradictions (e.g., the same event dated differently on two pages). Resolve by preferring the more detailed entry and flag with a note.
            - Detect orphan pages (pages with no `[[cross-refs]]` pointing TO them from any other page) — add at least one cross-reference from a logically-related page.
            - Detect near-duplicate pages (e.g., `gpt-5.md` and `chatgpt-5.md`). Merge and leave a redirect note on the loser page.
            - For pages untouched in the last 60 days based on "Last updated" frontmatter, mark `> **Status**: stale` if not already marked.
            - Regenerate `wiki/index.md` from the actual directory listing (alphabetical within each section).

            Step 4: Generate the weekly digest at `wiki/digests/YYYY-WW.md` using this template:

            ```
            # Weekly Digest — YYYY-WW (Week of YYYY-MM-DD)

            > **Ingest range**: YYYY-MM-DD → YYYY-MM-DD
            > **Summaries covered**: N (number of daily ingests this week)
            > **Wiki pages touched**: M (count from log.md entries this week)

            ## 🔥 This Week's Top Stories
            - **[Story]** — *Why it matters* — [[related-page]]
            (3-5 bullets — the highest-impact stories across the week)

            ## 🆕 New Pages Created
            - [[page-name]] — *one-line context*
            (grouped under Companies / Products / Topics / Trends)

            ## 📈 Pages with Biggest Updates
            (pages that got 3+ timeline entries this week — the ones that moved the most)

            ## 🔗 Cross-Cutting Patterns
            - <Patterns that appear across multiple pages — e.g., "three compute deals this week">
            (capture emerging trends the individual daily ingests might miss)

            ## 📌 Stories Worth Watching
            - <Things mentioned briefly that may grow — speculation on what to track next week>

            ---
            *Generated by weekly wiki lint.*
            ```

            Step 5: Update `wiki/index.md` — add this week's digest under the "Digests" section.

            Step 6: Append a LINT entry to `wiki/log.md` at the top (newest first) in this format:

            ```
            ## LINT YYYY-MM-DD (week YYYY-WW)

            **Lint actions**:
            - Fixed contradictions: <list if any>
            - Resolved orphans: <count>
            - Merged duplicates: <list if any>
            - Stale pages marked: <count>

            **Digest generated**: wiki/digests/YYYY-WW.md
            ```

            Rules:
            - Only touch files under `wiki/`. Never modify `data/summaries/`.
            - If the wiki is very new (< 7 days of ingests), still generate a digest covering what exists.
            - Keep the digest focused on SYNTHESIS across pages — don't just restate individual page timelines.
            - Do NOT commit — the next workflow step handles commits.
          claude_args: |
            --max-turns 60
            --model claude-opus-4-7
            --allowedTools Read,Write,Edit,Glob,Grep

      - name: Commit wiki changes
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add wiki/
          if git diff --staged --quiet; then
            echo "No wiki changes to commit"
          else
            git commit -m "wiki: weekly lint + digest $(date -u +%Y-%V)"
            git push
          fi

      - name: Find the latest digest file
        id: digest
        run: |
          LATEST=$(ls -1t wiki/digests/*.md 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then
            echo "No digest found — Claude Code did not generate one"
            exit 1
          fi
          echo "path=$LATEST" >> $GITHUB_OUTPUT
          echo "Found digest: $LATEST"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send weekly digest email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          DIGEST_PATH: ${{ steps.digest.outputs.path }}
          TZ: Asia/Kolkata
        run: node src/weekly-digest-email.js
